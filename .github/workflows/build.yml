name: Deploy Panat Kas Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 1. SIAPKAN WADAH WEB
      - name: Enable Web Platform
        run: flutter create . --platforms web

      - name: Install Dependencies
        run: flutter pub get

      # 2. RAKIT FLUTTER WEB (UNTUK IPHONE)
      - name: Build Flutter Web
        run: flutter build web --release --base-href "/panat-kas/"

      # 3. TERBITKAN OTOMATIS KE GITHUB PAGES
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
