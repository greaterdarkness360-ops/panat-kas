name: Build APK and Deploy Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 1. SIAPKAN WADAH WEB OTOMATIS
      - name: Enable Web Platform
        run: flutter create . --platforms web

      - name: Install Dependencies
        run: flutter pub get

      # 2. RAKIT FLUTTER WEB (UNTUK IPHONE)
      - name: Build Flutter Web
        run: flutter build web --release --base-href "/panat-kas/"

      # 3. TERBITKAN OTOMATIS KE GITHUB PAGES
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 4. RAKIT APK (UNTUK ANDROID WAKIL BENDAHARA)
      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Panat-Kas-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Panat Kas Terbaru"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
